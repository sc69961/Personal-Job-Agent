name: Job Agent — Daily Run

on:
  schedule:
    - cron: '0 11 * * 1-5'    # 5:00 AM MT (MDT=UTC-6) weekdays — trigger early to clear GitHub queue by 7:30-8 AM
  workflow_dispatch:
    inputs:
      force_email:
        description: 'Force email even if already sent today'
        required: false
        default: 'false'
        type: boolean
      rescue_errors:
        description: 'Re-queue API-error jobs for re-scoring (clears them from seen_ids before the run)'
        required: false
        default: 'false'
        type: boolean

# CONCURRENCY GUARD
# Only one job-agent run executes at a time. If a scheduled run and a manual
# run overlap, the second waits in a queue (cancel-in-progress: false) rather
# than both racing to push to the same branch. This eliminates the most common
# cause of git lock conflicts — two concurrent runs both writing data files.
concurrency:
  group: job-agent-main
  cancel-in-progress: false

# Default: no permissions — jobs must explicitly request what they need.
permissions: {}

jobs:
  run-job-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # needed to git-push persistent data files

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure directories exist
        run: mkdir -p output public config

      - name: Decode Google credentials
        run: echo "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" | base64 -d > config/google_credentials.json

      # Restore output cache AND OAuth token from previous run.
      # The token gets refreshed + saved back to disk each run, so the cache
      # always holds the most recent valid token — no manual Secret updates needed.
      - name: Restore state cache (output + OAuth token)
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: |
            output/
            config/google_token.pickle
          key: job-agent-state-${{ github.run_id }}
          restore-keys: |
            job-agent-state-

      # Only decode from Secret if the token file is truly absent.
      # cache-hit is 'false' even on a restore-keys partial match (different run_id),
      # so we check file existence rather than cache-hit to avoid overwriting a
      # freshly-cached token with the stale Secret on every run.
      - name: Decode Google OAuth token (cache miss fallback)
        run: |
          if [ ! -f config/google_token.pickle ]; then
            echo "${{ secrets.GOOGLE_TOKEN_PICKLE }}" | base64 -d > config/google_token.pickle
          fi

      # Skip the scheduled run if a manual (workflow_dispatch) run already
      # committed data today. This prevents double-running when Steve triggers
      # manually after the 5 AM scheduled run fires. Manual runs always proceed.
      - name: Skip if already ran today (schedule only)
        if: github.event_name == 'schedule'
        id: skip_check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          LAST=$(git log -1 --format="%as" -- output/first_seen_registry.json 2>/dev/null || echo "")
          if [ "$LAST" = "$TODAY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping: job agent already ran today ($TODAY via $LAST)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # Optional: re-queue jobs that previously failed due to API errors.
      # Removes their IDs from seen_ids.json in S3 so this run re-scores them.
      - name: Rescue API-error jobs (if requested)
        if: ${{ github.event.inputs.rescue_errors == 'true' && steps.skip_check.outputs.skip != 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: stevechristian-job-agent
          AWS_REGION: us-east-2
        run: python scripts/rescue_scoring_errors.py

      - name: Run Job Agent
        if: steps.skip_check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: stevechristian-job-agent
          AWS_REGION: us-east-2
          FORCE_EMAIL: ${{ github.event.inputs.force_email }}
        run: python main.py --headless

      # Save state AFTER the run — token may have been refreshed by the agent
      - name: Save state cache (output + refreshed OAuth token)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            output/
            config/google_token.pickle
          key: job-agent-state-${{ github.run_id }}

      # Commit key data files to the repo so they survive GitHub Actions cache expiry.
      # first_seen_registry: prevents job dates resetting on cache wipe
      # rejected_jobs: performance log (filtered/low-score history)
      # market_stats: historical PM role trend data for Market Intel tab
      # [skip ci] prevents this commit from re-triggering the workflow.
      # git_safe_push.sh handles stale lock cleanup and push retry automatically.
      # Run even if the agent crashed — ensures Firebase and git always get the
      # latest data, and gives us a commit to inspect when debugging failures.
      - name: Persist data files to repo
        if: always() && steps.skip_check.outputs.skip != 'true'
        run: |
          bash scripts/git_safe_push.sh \
            "output/first_seen_registry.json output/rejected_jobs.json output/market_stats.json output/seen_job_ids.json output/crm.json" \
            "chore: update job agent data [skip ci]"

      - name: Install Firebase CLI
        if: always() && steps.skip_check.outputs.skip != 'true'
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        if: always() && steps.skip_check.outputs.skip != 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 -d > /tmp/firebase-sa.json
          firebase deploy --only hosting:jobs || true
          rm -f /tmp/firebase-sa.json

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-agent-logs-${{ github.run_id }}
          path: output/job_agent.log
          retention-days: 14
