name: Dashboard — Deploy Only

# Rebuilds the Firebase dashboard from cached S3 data without running
# a full scrape/score/CRM cycle.  Use this when you've made UI changes
# (layout, CSS, filters, copy) and want them live in ~2 minutes instead
# of waiting for the 10-15 min full daily run.
#
# How it works:
#   1. Restore scored_jobs.json + crm.json from S3 (latest snapshot)
#   2. Run `python main.py --dashboard --headless` → writes public/index.html
#   3. Deploy public/ to Firebase Hosting

on:
  workflow_dispatch:   # Manual trigger only — Actions → Dashboard Deploy → Run workflow

concurrency:
  group: dashboard-deploy
  cancel-in-progress: true   # New deploy cancels any in-flight one

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure directories exist
        run: mkdir -p output public config

      # Pull scored_jobs.json, crm.json, and supporting files from S3.
      # This is faster than a cache restore and always has the latest data.
      - name: Restore data from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: stevechristian-job-agent
          AWS_REGION: us-east-2
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, '.')
          config = {
              "S3_BUCKET_NAME":        os.environ["S3_BUCKET_NAME"],
              "AWS_REGION":            os.environ["AWS_REGION"],
              "AWS_ACCESS_KEY_ID":     os.environ["AWS_ACCESS_KEY_ID"],
              "AWS_SECRET_ACCESS_KEY": os.environ["AWS_SECRET_ACCESS_KEY"],
          }
          from scripts.s3_storage import restore
          restore(config)
          print("S3 restore complete")
          EOF

      # Generate public/index.html from the restored data.
      # --dashboard: read scored_jobs.json + crm.json from output/
      # --headless:  write to public/index.html instead of opening browser
      - name: Generate dashboard HTML
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: stevechristian-job-agent
          AWS_REGION: us-east-2
        run: python main.py --dashboard --headless

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        run: firebase deploy --only hosting:jobs --token "${{ secrets.FIREBASE_TOKEN }}"
